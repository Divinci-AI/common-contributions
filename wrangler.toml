name = "common-contributions-preview"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "common-contributions-proposals"
database_id = "aaacf755-2e47-450a-b7e6-e2ba46e82a19"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put`, never in this file): PROPOSALS_SUBMIT_TOKEN and PROPOSALS_ADMIN_TOKEN, two different values.
